<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:image" content="episode-1/1.png">
<title>미나와 준 · Kanhwa demo comic</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #5f5f66; --bg: #ffffff; --line: #e3e3e8; --link: #0a66c2; }
  @media (prefers-color-scheme: dark) { :root { --text: #f2f2f5; --muted: #a8a8b0; --bg: #111113; --line: #2c2c31; --link: #6cb0ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 32px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
  img { display: block; width: 100%; height: auto; margin: 0 0 12px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>미나와 준</h1>
  <p class="muted">Mina and Jun · a demo comic for Kanhwa</p>
  <p>An original two-episode Korean comic, made for Kanhwa by its developer so the app can be tried with content that is free to use.</p>
  <h2>Episodes</h2>
  <ul id="chapter-list">
    <li><a href="episode-1/">Episode 1: 비 오는 날</a></li>
    <li><a href="episode-2/">Episode 2: 도서관에서</a></li>
  </ul>
</main>
</body>
</html>
